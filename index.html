<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hides the raw page from search engine indexing -->
    <meta name="robots" content="noindex">
    <!-- Simple emoji favicon to prevent 404 console errors -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
    
    <title>Soul Spa Audio Guide</title>
    
    <style>
        :root {
            --primary-bg: transparent;
            --card-bg: #ffffff; 
            --text-main: #2d3748;
            --text-muted: #4a5568; /* Darkened to meet WCAG AA contrast standards */
            --accent: #4a5568;
            --highlight: rgba(0, 0, 0, 0.08);
            --hover-bg: rgba(0, 0, 0, 0.04);
            --active-bg: rgba(74, 85, 104, 0.08); /* Soft background for currently playing track */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 100dvh prevents unwanted scrolling caused by iOS Safari's URL bar */
            min-height: 100dvh; 
        }

        .player-card {
            background-color: transparent; /* Allows your website background to show through */
            padding: 20px 10px;
            width: 85%; /* Shrunk to give breathing room on small screens */
            max-width: 400px; 
            display: flex;
            flex-direction: column;
        }

        .org-logo {
            width: 190px; /* Perfectly scaled to match the text below */
            height: auto;
            margin-bottom: 20px;
            mix-blend-mode: multiply; 
        }

        .now-playing-section {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--highlight);
            margin-bottom: 15px;
        }

        .exhibition-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px; 
        }

        .track-title {
            font-size: 28px; 
            font-weight: 700;
            margin: 0 0 20px 0; 
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        audio {
            width: 100%; /* Forces native player to align perfectly with custom track list padding */
            margin: 0; 
            display: block; 
            outline: none;
        }

        .playlist-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .track-link {
            display: flex;
            align-items: center;
            padding: 12px 14px; /* 14px aligns our circle with the iOS play button */
            color: var(--text-main);
            border-radius: 14px;
            transition: all 0.2s ease;
            font-size: 16px; 
            font-weight: 500;
            cursor: pointer;
            
            /* Resetting default <button> styles */
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .track-link:hover, .track-link:active {
            background-color: var(--hover-bg);
        }

        /* Accessibility: Outline for keyboard navigation */
        .track-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        /* Highlights the currently playing track */
        .track-link.active {
            background-color: var(--active-bg);
            font-weight: 700;
        }

        .play-icon {
            width: 28px;
            height: 28px;
            background-color: var(--highlight);
            color: var(--accent);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 10px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .track-link:hover .play-icon, .track-link:active .play-icon, .track-link.active .play-icon {
            background-color: var(--accent);
            color: white;
        }
    </style>
</head>
<body>

    <div class="player-card">
        
        <div class="now-playing-section">
            <img src="bk-logo.jpg" alt="Brahma Kumaris UK" class="org-logo" onerror="this.style.display='none'">
            
            <div class="exhibition-title">Soul Spa Audio Guide</div>
            <h1 class="track-title" id="current-title">Loading...</h1>
            
            <!-- preload="metadata" saves mobile data by only loading track lengths, not full files until played -->
            <audio id="audio-player" controls controlsList="nodownload" preload="metadata">
                <source id="audio-source" src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="playlist-section" id="playlist-container">
            <!-- The track list will dynamically populate here -->
        </div>

    </div>

    <script>
        // MASTER TRACK LIST (In exact exhibition order)
        const tracks = [
            { id: 'power', title: 'Power', file: 'power.mp3' },
            { id: 'purity', title: 'Purity', file: 'purity.mp3' },
            { id: 'happiness', title: 'Happiness', file: 'happiness.mp3' },
            { id: 'love', title: 'Love', file: 'love.mp3' },
            { id: 'peace', title: 'Peace', file: 'peace.mp3' },
            { id: 'knowledge', title: 'Knowledge', file: 'knowledge.mp3' },
            { id: 'bliss', title: 'Bliss', file: 'bliss.mp3' }
        ];

        // Function to load a track, update UI, and manage browser history safely
        function loadTrack(trackId, autoplay = false, history_mode = 'none') {
            const currentTrack = tracks.find(t => t.id === trackId) || tracks[0];

            // 1. Update text
            document.getElementById('current-title').textContent = currentTrack.title;
            document.title = `Soul Spa - ${currentTrack.title}`;
            
            // 2. Load audio
            const audioPlayer = document.getElementById('audio-player');
            const audioSource = document.getElementById('audio-source');
            audioSource.src = currentTrack.file;
            audioPlayer.load(); 
            
            // 3. Autoplay (with catch for mobile browser blocking rules)
            if (autoplay) {
                audioPlayer.play().catch(() => {});
            }

            // 4. Update the "Active" styling in the playlist
            document.querySelectorAll('.track-link').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.id === currentTrack.id) {
                    btn.classList.add('active');
                }
            });

            // 5. Update mobile Lock-Screen metadata (iOS/Android)
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: currentTrack.title,
                    artist: 'Brahma Kumaris UK',
                    album: 'Soul Spa Audio Guide'
                });
            }

            // 6. Manage browser history specifically so the "Back" button doesn't get trapped
            if (history_mode !== 'none') {
                try {
                    const newUrl = window.location.pathname + '?track=' + currentTrack.id;
                    // 'pushState' creates a new back button entry, 'replaceState' overwrites the current one
                    window.history[history_mode === 'push' ? 'pushState' : 'replaceState']({}, '', newUrl);
                } catch (error) {
                    console.log("Running locally, URL update skipped.");
                }
            }
        }

        // Function to build semantic <button> elements for accessibility
        function buildPlaylist() {
            const playlistContainer = document.getElementById('playlist-container');
            
            tracks.forEach(track => {
                const btn = document.createElement('button');
                btn.className = 'track-link';
                btn.dataset.id = track.id; // Store ID for active state highlighting
                btn.innerHTML = `<span class="play-icon">▶</span> ${track.title}`;
                
                // User taps a track -> 'push' to history so they can use the back button
                btn.onclick = function() {
                    loadTrack(track.id, true, 'push'); 
                };
                
                playlistContainer.appendChild(btn);
            });
        }

        // STARTUP LOGIC
        const urlParams = new URLSearchParams(window.location.search);
        let initialTrackId = urlParams.get('track') || 'power';
        
        buildPlaylist();
        
        // Initial load -> 'replace' history to clean up messy URLs without breaking the back button
        loadTrack(initialTrackId, false, 'replace');
        
        // User presses the physical phone "Back" button -> 'none' so we don't trap them in a loop
        window.onpopstate = function() {
            const newParams = new URLSearchParams(window.location.search);
            const backTrackId = newParams.get('track') || 'power';
            loadTrack(backTrackId, false, 'none');
        };
    </script>
</body>
</html>
